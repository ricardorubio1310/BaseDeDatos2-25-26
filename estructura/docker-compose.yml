version: "3.9"

services:

  # =========================================
  # MongoDB
  # =========================================

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123

    volumes:
      - mongodb_data:/data/db

    networks:
      - bd2_network


  # =========================================
  # Mongo Express
  # =========================================

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: unless-stopped

    depends_on:
      - mongodb

    ports:
      - "8081:8081"

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123

      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017

      ME_CONFIG_BASICAUTH_USERNAME: profesor
      ME_CONFIG_BASICAUTH_PASSWORD: profesor123

    networks:
      - bd2_network


  # =========================================
  # Neo4j
  # =========================================

  neo4j:
    image: neo4j:5
    container_name: neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password123

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

    networks:
      - bd2_network


  # =========================================
  # Mongosh (cliente CLI)
  # =========================================

  mongosh:
    image: mongo:7
    container_name: mongosh

    depends_on:
      - mongodb

    stdin_open: true
    tty: true

    command: >
      mongosh
      mongodb://admin:admin123@mongodb:27017/admin

    networks:
      - bd2_network


# =========================================
# Volúmenes
# =========================================

volumes:

  mongodb_data:
  neo4j_data:
  neo4j_logs:


# =========================================
# Red
# =========================================

networks:

  bd2_network:
    driver: bridge